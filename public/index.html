<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10131a">
<title>RuiwCook · 做饭模拟器</title>
<link rel="stylesheet" href="style.css">

<style>
.account-area {
  display:flex;
  align-items:center;
  gap:8px;
}

.username {
  font-size:13px;
  color:#aaa;
  max-width:90px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.logout-btn {
  border:1px solid #444;
  background:#20242d;
  color:#ddd;
  border-radius:9px;
  padding:6px 9px;
  font-size:12px;
  cursor:pointer;
}

.auth-page {
  min-height:calc(100vh - 90px);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px 16px;
}

.auth-card {
  width:100%;
  max-width:420px;
  background:#181c24;
  border:1px solid #2b303a;
  border-radius:20px;
  padding:28px 22px;
  box-shadow:0 12px 40px rgba(0,0,0,.25);
}

.auth-logo {
  text-align:center;
  font-size:48px;
  margin-bottom:8px;
}

.auth-title {
  text-align:center;
  margin:0;
  font-size:28px;
}

.auth-subtitle {
  text-align:center;
  color:#999;
  margin:8px 0 24px;
}

.auth-tabs {
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.auth-tab {
  flex:1;
  border:1px solid #333944;
  background:#20242d;
  color:#aaa;
  border-radius:10px;
  padding:11px;
  font-size:15px;
  cursor:pointer;
}

.auth-tab.active {
  background:#fff;
  color:#111;
}

.auth-input {
  width:100%;
  padding:13px 14px;
  margin-bottom:12px;
  border-radius:11px;
  border:1px solid #343a46;
  background:#10131a;
  color:#fff;
  outline:none;
  font-size:16px;
}

.auth-input:focus {
  border-color:#777;
}

.auth-submit {
  width:100%;
  border:0;
  border-radius:11px;
  padding:13px;
  background:#fff;
  color:#111;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.auth-submit:disabled {
  opacity:.5;
}

.auth-message {
  min-height:20px;
  margin-top:12px;
  text-align:center;
  font-size:13px;
  color:#aaa;
}

.auth-tip {
  margin-top:16px;
  text-align:center;
  color:#777;
  font-size:12px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">

    <div class="brand">
      <span class="logo">🍳</span>
      <div>
        <strong>RuiwCook</strong>
        <small>做饭模拟器</small>
      </div>
    </div>

    <div class="account-area">
      <span id="username" class="username"></span>

      <div class="wallet">
        💰 <span id="money">80</span> ri币
      </div>

      <button id="logoutBtn" class="logout-btn" style="display:none;">
        退出
      </button>
    </div>

  </header>

  <main id="app"></main>

  <nav class="bottom-nav" id="bottomNav" style="display:none;">
    <button data-page="cook" class="active">
      🍳<span>做饭</span>
    </button>

    <button data-page="shop">
      🛒<span>食材</span>
    </button>

    <button data-page="storage">
      📦<span>仓库</span>
    </button>
  </nav>

</div>

<div id="toast" class="toast"></div>

<script src="dishes.js"></script>
<script src="game.js"></script>

</body>
</html>
